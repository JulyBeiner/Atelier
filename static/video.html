<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360, initial-scale=1">
<title>Vídeo con la propuesta | Atelier</title>
<!--
  The video that carries my proposal to a clinic, as an animated page of 360 x 640.
  video.py fills it with one clinic's words and pictures, puts it at each moment with seek(seconds) and
  photographs it frame by frame (30 per second, at twice the size) to make the mp4.
  Opened by itself in the browser it plays a demo with an invented clinic, to look at the design.
  With ?still in the address it stays at the first frame.
  Times are in seconds from the start of the video. Every text goes in with textContent, never as HTML.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=block">
<style>
:root {
  --cream: #FBF6EF;
  --peach: #F9E1D6;
  --coral: #EFA48C;
  --sage: #DCDDC4;
  --olive: #A8A97A;
  --olive-deep: #5E6440;
  --ink: #2B2420;
  --soft: #4A413A;
  --muted: #74695F;
  --chat: #F4EDE3;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Instrument Sans", "Segoe UI", Arial, sans-serif;
  --hand: "Caveat", "Segoe Print", cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--cream); }
body { -webkit-font-smoothing: antialiased; }
#stage {
  position: relative; width: 360px; height: 640px; overflow: hidden;
  background: var(--cream); color: var(--ink); font-family: var(--sans);
}
.scene { position: absolute; inset: 0; padding: 34px 30px 30px; }
p { margin: 0; }
.logo { display: block; height: 26px; width: auto; align-self: flex-start; }
/* A soft peach circle behind the words: warmth, never decoration that shouts */
.blob { position: absolute; width: 320px; height: 320px; border-radius: 50%; background: var(--peach); right: -150px; top: 120px; }

/* The handwritten note on top of each scene. It tilts; the block around it is what moves. */
.head { position: relative; }
.kicker {
  display: inline-block; font-family: var(--hand); font-weight: 600; font-size: 31px; line-height: 1;
  color: var(--olive-deep); transform: rotate(-2deg); transform-origin: left center;
}
.kicker-sub { margin-top: 7px; font-size: 13px; line-height: 1.4; color: var(--muted); max-width: 30ch; }

/* 1. The clinic and me. It is the first picture of the video, so it is complete from the very first frame. */
.hello { display: flex; flex-direction: column; justify-content: space-between; }
.hello-mid { position: relative; }
.for {
  display: inline-block; font-family: var(--hand); font-weight: 600; font-size: 34px; line-height: 1;
  color: var(--olive-deep); transform: rotate(-3deg); transform-origin: left center; margin-bottom: 8px;
}
.clinic-name {
  font-family: var(--serif); font-weight: 400; font-size: 50px; line-height: 1.02; letter-spacing: -0.02em;
  margin: 0; text-wrap: balance; overflow-wrap: break-word;
}
.clinic-name.long { font-size: 41px; }
.clinic-name.longer { font-size: 34px; }
.stroke { width: 64px; height: 3px; border-radius: 3px; background: var(--coral); margin: 24px 0 18px; transform-origin: left center; }
.intro { font-size: 16px; line-height: 1.45; color: var(--soft); max-width: 25ch; }
.byline { position: relative; font-size: 12.5px; color: var(--muted); }

/* The phone: their website, or the prototype */
.phone {
  position: absolute; left: 50%; width: 210px; height: 420px; margin-left: -105px;
  border-radius: 34px; background: var(--ink); padding: 7px;
}
.screen { position: relative; width: 100%; height: 100%; border-radius: 28px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
.island { position: absolute; top: 9px; left: 50%; width: 56px; height: 15px; margin-left: -28px; border-radius: 10px; background: var(--ink); z-index: 3; }
.status {
  flex: none; height: 32px; display: flex; align-items: center; justify-content: space-between;
  padding: 2px 18px 0 22px; font-size: 10.5px; font-weight: 600; background: #fff; color: var(--ink);
}
.status.dark { background: var(--olive-deep); color: var(--cream); }
.battery { width: 17px; height: 8px; border: 1.2px solid currentColor; border-radius: 3px; opacity: 0.8; }
.site { position: relative; flex: 1; overflow: hidden; background: #fff; }
.shot { display: block; width: 100%; height: auto; transform-origin: 50% 0; }
.site-fake { padding: 18px 16px; font-size: 11px; color: var(--muted); }
.site-fake i { display: block; height: 10px; border-radius: 5px; background: #EEE7DC; margin-top: 10px; }
.site-fake i.big { height: 90px; border-radius: 10px; }

/* 2. What I saw */
.seen .phone { top: 102px; }
.fact { position: absolute; left: 20px; right: 20px; bottom: 22px; background: var(--sage); border-radius: 18px; padding: 15px 20px 18px; }
.fact .label { font-family: var(--hand); font-weight: 600; font-size: 22px; line-height: 1.1; color: var(--olive-deep); }
.fact h2 { font-family: var(--serif); font-weight: 400; font-size: 25px; line-height: 1.1; letter-spacing: -0.01em; margin: 4px 0 7px; text-wrap: balance; }
.fact .detail { font-size: 13.5px; line-height: 1.4; color: var(--soft); }

/* 3. The prototype: a WhatsApp conversation that books by itself */
.proto .phone { top: 112px; }
.chat { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--chat); }
.chat-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 10px 8px; background: var(--olive-deep); color: var(--cream); }
.avatar {
  flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--peach); color: var(--ink);
  font-family: var(--serif); font-size: 13px; display: grid; place-items: center;
}
.who { min-width: 0; line-height: 1.2; }
.who b { display: block; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 9.5px; opacity: 0.8; }
/* New messages push the old ones up, as in a real chat: the list sits at the bottom and grows upwards. */
.chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; padding: 0 8px 6px; }
.row { display: flex; overflow: hidden; margin-top: 6px; flex: none; }
.row.patient { justify-content: flex-end; }
.bubble { max-width: 86%; padding: 6px 8px 4px; border-radius: 11px; font-size: 11px; line-height: 1.38; }
.patient .bubble { background: var(--sage); border-bottom-right-radius: 3px; }
.clinic .bubble { background: #fff; border-bottom-left-radius: 3px; }
.time { display: block; text-align: right; font-size: 8.5px; color: var(--muted); margin-top: 1px; }
.slots { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.slot {
  position: relative; border: 1px solid var(--olive-deep); color: var(--olive-deep); background: #fff;
  border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 600;
}
.ring { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(43, 36, 32, 0.28); opacity: 0; }
.dots { display: flex; gap: 3px; padding: 4px 2px 3px; }
.dots i { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--olive); opacity: 0.35; }
.chat-input { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 7px 10px; }
.field { flex: 1; background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 10px; color: var(--muted); }
.send { flex: none; width: 25px; height: 25px; border-radius: 50%; background: var(--olive-deep); }
.caption {
  position: absolute; left: 20px; right: 20px; bottom: 20px; background: var(--sage); border-radius: 18px;
  padding: 13px 18px 15px; font-family: var(--serif); font-size: 20px; line-height: 1.15; text-wrap: balance;
}

/* 4. What it would include. No prices. */
.title { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1.02; letter-spacing: -0.02em; margin: 14px 0 24px; }
.point { display: flex; gap: 14px; align-items: baseline; background: var(--sage); border-radius: 18px; padding: 16px 18px 17px; margin-top: 10px; }
.point b { flex: none; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 0.8; color: var(--olive-deep); }
.point span { font-size: 15.5px; line-height: 1.4; }
.foot { margin-top: 20px; font-size: 13.5px; line-height: 1.4; color: var(--muted); }

/* 5. The invitation to a call. It stays until the end. */
.call { display: flex; flex-direction: column; justify-content: center; }
.call-words { position: relative; }
.call h2 { font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 18px; text-wrap: balance; }
.call .text { font-size: 16px; line-height: 1.45; color: var(--soft); max-width: 25ch; }
.sign { position: relative; margin-top: 40px; }
.sign .logo { height: 34px; }
.sign .role { margin-top: 10px; font-size: 12.5px; line-height: 1.4; color: var(--muted); max-width: 32ch; }
.thanks-box { position: absolute; right: 30px; bottom: 44px; }
.thanks { display: inline-block; font-family: var(--hand); font-weight: 600; font-size: 25px; color: var(--olive-deep); transform: rotate(-3deg); }

</style>
</head>
<body>
<div id="stage"></div>
<!--VIDEO-DATA-->
<script>
// An invented clinic, for when the page is opened by itself. video.py puts the real words in window.VIDEO.
const DEMO = {
  clinic: "Clínica Demo Aurora", initials: "DA", domain: "example.com", shot: "", logo: "/static/julbeiner-logo.svg",
  intro: "Lo que he visto en vuestra web y una idea para que no se os escape ninguna cita.",
  byline: "Un vídeo de Jul Beiner",
  seen: {
    kicker: "Lo que he visto", sub: "En vuestra web, desde el móvil", label: "Lo primero que cambiaría",
    headline: "Para pedir cita, solo se puede llamar.", detail: "Ni WhatsApp, ni chat, ni reserva online.",
  },
  proto: {
    kicker: "Así quedaría", sub: "Una paciente os escribe a las 23:14, con la clínica cerrada.",
    status: "en línea", input: "Escribe un mensaje", clock: "23:14",
    ask: "Hola, ¿tenéis hueco esta semana para una limpieza facial?", ask_time: "23:14",
    hello: "¡Hola! Soy el asistente de Clínica Demo Aurora. Para una limpieza facial tengo estos huecos:", hello_time: "23:14",
    slots: ["Jue 10:30", "Jue 17:00", "Vie 12:00"], pick: 1,
    picked: "El jueves a las 17:00, por favor", picked_time: "23:15",
    done: "Hecho: te esperamos el jueves a las 17:00. El día antes te mandamos un recordatorio.", done_time: "23:15",
    caption: "La cita queda en vuestra agenda sin que nadie del equipo toque el móvil.",
  },
  includes: {
    kicker: "La propuesta", title: "Qué incluiría",
    points: ["Un WhatsApp que contesta y reserva solo, a cualquier hora.",
             "Conectado a vuestra agenda: sin citas dobles ni huecos perdidos.",
             "Un recordatorio el día antes, para que no se pierdan citas."],
    foot: "Todo se adapta a cómo trabajáis hoy.",
  },
  call: {
    title: "¿Lo vemos en una llamada corta?",
    text: "Contestad a este mensaje y os cuento cómo funcionaría en vuestra clínica.",
    role: "Jul Beiner · Software, automatizaciones y marketing para clínicas estéticas",
    thanks: "Gracias por vuestro tiempo",
  },
};
const V = window.VIDEO || DEMO;
// When each scene starts, and the end of the video.
const T = { seen: 4.6, proto: 15.0, includes: 30.6, call: 39.8, end: 46.0 };
const stage = document.getElementById("stage");

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---- The moves ----
// The page draws every moment itself, from the time: seek(seconds). There are no CSS animations,
// because a browser that pauses them can forget to paint some of the page in a photograph.

// The shape of each move: the style it gives at each point p, from 0 (start) to 1 (end).
const mix = (from, to, p) => "#" + [0, 2, 4].map((at) => Math.round(
  parseInt(from.slice(at + 1, at + 3), 16) * (1 - p) + parseInt(to.slice(at + 1, at + 3), 16) * p,
).toString(16).padStart(2, "0")).join("");
const SHAPES = {
  appear: (p) => ({ opacity: p }),
  vanish: (p) => ({ opacity: 1 - p }),
  rise: (p) => ({ opacity: p, transform: `translateY(${16 * (1 - p)}px)` }),
  lift: (p) => ({ opacity: p, transform: `translateY(${70 * (1 - p)}px)` }),
  grow: (p) => ({ transform: `scaleX(${p})` }),
  drift: (p) => ({ transform: `scale(${1 + 0.07 * p})` }),
  enter: (p) => ({ maxHeight: 160 * p + "px", marginTop: 6 * p + "px", opacity: p, transform: `translateY(${8 * (1 - p)}px)` }),
  leave: (p) => ({ maxHeight: 40 * (1 - p) + "px", marginTop: 6 * (1 - p) + "px", opacity: 1 - p }),
  dot: (p) => {
    const up = p < 0.4 ? p / 0.4 : (1 - p) / 0.6;
    return { opacity: 0.35 + 0.65 * up, transform: `translateY(${-2 * up}px)` };
  },
  tap: (p) => ({ opacity: 0.7 * (1 - p), transform: `scale(${0.3 + 1.3 * p})` }),
  pick: (p) => ({ backgroundColor: mix("#ffffff", "#5e6440", p), color: mix("#5e6440", "#fbf6ef", p) }),
};

// Easing curves, as in CSS: cubic-bezier(x1, y1, x2, y2).
const CURVES = { ease: [0.25, 0.1, 0.25, 1], "ease-in-out": [0.42, 0, 0.58, 1], "ease-out": [0, 0, 0.58, 1], linear: null };
const EASE = [0.22, 0.7, 0.2, 1];
function curve(spec) {
  const points = Array.isArray(spec) ? spec : CURVES[spec];
  if (!points) return (x) => x;
  const [x1, y1, x2, y2] = points;
  const bezier = (a, b, t) => 3 * a * (1 - t) * (1 - t) * t + 3 * b * (1 - t) * t * t + t * t * t;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let low = 0, high = 1, t = x;
    for (let step = 0; step < 30; step++) {
      t = (low + high) / 2;
      if (bezier(x1, x2, t) < x) low = t; else high = t;
    }
    return bezier(y1, y2, t);
  };
}

const moves = [];
// One move of one element: its shape, when it starts and how long it lasts, in seconds.
// fill says what it shows outside that time, as in CSS: "both", "forwards" (after) or "none".
// count repeats it. When two moves change the same thing at once, the later one wins.
function play(node, name, at, seconds, { easing = EASE, fill = "both", count = 1 } = {}) {
  moves.push({ node, shape: SHAPES[name], at, seconds, count, fill, ease: curve(easing),
               changes: Object.keys(SHAPES[name](0)) });
  return node;
}

// Puts the whole page at one moment of the video.
function seek(seconds) {
  moves.forEach((move) => move.changes.forEach((name) => { move.node.style[name] = ""; }));
  moves.forEach((move) => {
    const end = move.at + move.seconds * move.count;
    let p;
    if (seconds < move.at) {
      if (move.fill !== "both") return;
      p = 0;
    } else if (seconds >= end) {
      if (move.fill === "none") return;
      p = 1;
    } else {
      const run = (seconds - move.at) / move.seconds;
      p = run - Math.floor(run);
    }
    Object.assign(move.node.style, move.shape(move.ease(p)));
  });
}

// A scene fades in a little before the last one has gone, so the screen is never empty.
function scene(name, from, to) {
  const node = el("section", "scene " + name);
  if (from > 0) play(node, "appear", from - 0.25, 0.6, { easing: "ease" });
  if (to) play(node, "vanish", to - 0.5, 0.5, { easing: "ease", fill: "forwards" });
  stage.append(node);
  return node;
}

function header(kicker, sub, at) {
  const head = el("div", "head");
  head.append(el("p", "kicker", kicker));
  if (sub) head.append(el("p", "kicker-sub", sub));
  return play(head, "rise", at, 0.7);
}

function phone(className, clock, dark, ...inside) {
  const body = el("div", "phone " + className);
  const screen = el("div", "screen");
  const status = el("div", "status" + (dark ? " dark" : ""));
  status.append(el("span", "", clock), el("span", "battery"));
  screen.append(status, ...inside);
  body.append(screen, el("div", "island"));
  return body;
}

function logo(className) {
  const image = el("img", "logo" + (className ? " " + className : ""));
  image.src = V.logo;
  image.alt = "julbeiner";
  return image;
}

// ---- 1. The clinic and me ----
const hello = scene("hello", 0, T.seen);
const helloMid = el("div", "hello-mid");
const size = V.clinic.length > 34 ? " longer" : V.clinic.length > 20 ? " long" : "";
helloMid.append(el("p", "for", "Para"), el("h1", "clinic-name" + size, V.clinic),
  play(el("div", "stroke"), "grow", 0.3, 0.9), el("p", "intro", V.intro));
hello.append(el("div", "blob"), logo(), helloMid, el("p", "byline", V.byline));

// ---- 2. What I saw: their own website on a phone, and the one fact ----
const seen = scene("seen", T.seen, T.proto);
const site = el("div", "site");
if (V.shot) {
  const shot = el("img", "shot");
  shot.src = V.shot;
  shot.alt = "";
  site.append(play(shot, "drift", T.seen + 0.6, T.proto - T.seen - 0.6, { easing: "linear" }));
} else {
  const fake = el("div", "site-fake", V.domain);
  fake.append(el("i", "big"), el("i"), el("i"), el("i"));
  site.append(fake);
}
const fact = el("div", "fact");
fact.append(el("p", "label", V.seen.label), el("h2", "", V.seen.headline), el("p", "detail", V.seen.detail));
seen.append(header(V.seen.kicker, V.seen.sub, T.seen + 0.1),
  play(phone("site-phone", "10:24", false, site), "lift", T.seen + 0.2, 0.9),
  play(fact, "rise", T.seen + 2.4, 0.8));

// ---- 3. The prototype: a patient writes at night and the clinic's WhatsApp books her by itself ----
const P = V.proto;
const S = T.proto;

function message(from, text, time, at) {
  const row = el("div", "row " + from);
  const bubble = el("div", "bubble");
  bubble.append(el("span", "", text), el("span", "time", time));
  row.append(bubble);
  return play(row, "enter", at, 0.45);
}

function typing(from, to) {
  const row = el("div", "row clinic");
  const bubble = el("div", "bubble");
  const dots = el("div", "dots");
  const beats = Math.max(1, Math.floor((to - from - 0.2) / 0.9));
  for (let index = 0; index < 3; index++) {
    dots.append(play(el("i"), "dot", from + 0.2 + index * 0.15, 0.9, { easing: "ease-in-out", fill: "none", count: beats }));
  }
  bubble.append(dots);
  row.append(bubble);
  play(row, "enter", from, 0.3);
  return play(row, "leave", to - 0.2, 0.2, { easing: "ease", fill: "forwards" });
}

function offer(text, time, slots, pick, at, tapAt) {
  const row = message("clinic", "", time, at);
  const bubble = row.querySelector(".bubble");
  bubble.firstChild.textContent = text;
  const box = el("div", "slots");
  slots.forEach((words, index) => {
    const slot = el("span", "slot", words);
    if (index === pick) {
      play(slot, "pick", tapAt + 0.15, 0.3, { easing: "ease", fill: "forwards" });
      slot.append(play(el("span", "ring"), "tap", tapAt, 0.6, { easing: "ease-out", fill: "none" }));
    }
    box.append(slot);
  });
  bubble.insertBefore(box, bubble.lastChild);
  return row;
}

const proto = scene("proto", S, T.includes);
const chatHead = el("div", "chat-head");
const who = el("div", "who");
who.append(el("b", "", V.clinic), el("span", "", P.status));
chatHead.append(el("div", "avatar", V.initials), who);
const chatBody = el("div", "chat-body");
chatBody.append(
  message("patient", P.ask, P.ask_time, S + 1.2),
  typing(S + 2.2, S + 3.7),
  offer(P.hello, P.hello_time, P.slots, P.pick, S + 3.7, S + 6.6),
  message("patient", P.picked, P.picked_time, S + 7.4),
  typing(S + 8.2, S + 9.7),
  message("clinic", P.done, P.done_time, S + 9.7),
);
const chatInput = el("div", "chat-input");
chatInput.append(el("span", "field", P.input), el("span", "send"));
const chat = el("div", "chat");
chat.append(chatHead, chatBody, chatInput);
proto.append(header(P.kicker, P.sub, S + 0.1),
  play(phone("chat-phone", P.clock, true, chat), "lift", S + 0.2, 0.9),
  play(el("p", "caption", P.caption), "rise", S + 11.4, 0.8));

// ---- 4. What it would include ----
const I = V.includes;
const includes = scene("includes", T.includes, T.call);
includes.append(header(I.kicker, "", T.includes + 0.1),
  play(el("h2", "title", I.title), "rise", T.includes + 0.3, 0.7));
I.points.forEach((words, index) => {
  const point = el("div", "point");
  point.append(el("b", "", String(index + 1)), el("span", "", words));
  includes.append(play(point, "rise", T.includes + 1.0 + index * 0.9, 0.7));
});
includes.append(play(el("p", "foot", I.foot), "rise", T.includes + 1.3 + I.points.length * 0.9, 0.7));

// ---- 5. The invitation to a call, signed ----
const C = V.call;
const call = scene("call", T.call, 0);
const callWords = el("div", "call-words");
callWords.append(play(el("h2", "", C.title), "rise", T.call + 0.3, 0.8),
  play(el("p", "text", C.text), "rise", T.call + 0.9, 0.8));
const sign = el("div", "sign");
sign.append(logo(), el("p", "role", C.role));
const thanks = el("div", "thanks-box");
thanks.append(el("span", "thanks", C.thanks));
call.append(el("div", "blob"), callWords, play(sign, "rise", T.call + 1.6, 0.8), play(thanks, "rise", T.call + 2.4, 0.8));

// ---- For video.py ----
const FONTS = ["400 48px 'Instrument Serif'", "400 16px 'Instrument Sans'", "500 16px 'Instrument Sans'",
               "600 16px 'Instrument Sans'", "600 30px Caveat"];
const pause = (ms) => new Promise((done) => setTimeout(done, ms));

// Resolves with the length of the video once the typefaces and the pictures are in (or after 15 seconds).
window.ready = (async () => {
  const fonts = Promise.all(FONTS.map((font) => document.fonts.load(font, "Áá¿?ñ"))).then(() => document.fonts.ready);
  await Promise.race([fonts.catch(() => {}), pause(15000)]);
  await Promise.all([...document.images].map((image) => image.decode().catch(() => {})));
  return T.end;
})();

window.seek = seek;
// When something moves, as [from, to] in seconds. Outside those spans the picture does not change,
// so one photograph serves many frames.
window.spans = () => moves.map((move) => [move.at, move.at + move.seconds * move.count]);

seek(0);
if (!window.VIDEO && !location.search.includes("still")) {
  // Opened by itself: it plays on a loop, with a short pause at the end.
  const start = performance.now();
  const tick = (now) => {
    seek(((now - start) / 1000) % (T.end + 1.5));
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
